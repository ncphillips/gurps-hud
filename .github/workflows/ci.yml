name: CI

on:
  push:
    branches: [main]
  pull_request:

# The verify job only reads the repo; artifact uploads authenticate with the Actions
# runtime token, not GITHUB_TOKEN. Pinning this here stops the job inheriting the
# repository's read-write default.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run check

      - run: pnpm test

      # Both browser suites need a Chromium but not a Foundry world: the e2e specs drive the dev
      # harness, and the a11y scans mount components in Vitest's browser mode through Playwright.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:e2e

      # Its own step so a red axe scan reads as an accessibility regression, not a broken feature.
      - run: pnpm run test:a11y

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: gurps-hud-dist
          path: dist/
