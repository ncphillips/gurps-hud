name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      - run: npm test

      # Both browser suites need a Chromium but not a Foundry world: the e2e specs drive the dev
      # harness, and the a11y scans mount components in Vitest's browser mode through Playwright.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # Its own step so a red axe scan reads as an accessibility regression, not a broken feature.
      - run: npm run test:a11y

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: gurps-hud-dist
          path: dist/
